  window.GameAnimations.game4 = function(ctx, W, H, t) {
    const loop = 6.0;
    const phase = U.getPhase(3, t, loop);

    const expStart = 0.56;
    const isExploding = phase >= expStart && phase < 0.88;
    const shake = isExploding ? (1 - (phase - expStart) / 0.32) * 10.5 : 0;

    // Dynamic action camera pushing in on Duke's Mighty Boot stomp & RPG explosion
    const actionPush = (phase >= 0.25 && phase < 0.85)
      ? Math.sin(((phase - 0.25) / 0.60) * Math.PI)
      : 0;
    const camX = W * 0.5 + actionPush * 10 + Math.sin(t * 50) * shake;
    const camY = H * 0.5 + actionPush * 6 + Math.cos(t * 43) * shake;
    const camZoom = 1.0 + actionPush * 0.065;

    ctx.save();
    U.applySceneCamera(ctx, W, H, camX, camY, camZoom, 0);

    // 1. Nocturnal 1996 Los Angeles Sky, Police Chopper & Varied Skyline
    const skyGrad = ctx.createLinearGradient(0, 0, 0, H);
    skyGrad.addColorStop(0, '#0d061a');
    skyGrad.addColorStop(0.5, '#2b1126');
    skyGrad.addColorStop(0.8, '#591c19');
    skyGrad.addColorStop(1, '#1a181c');
    ctx.fillStyle = skyGrad;
    ctx.fillRect(-25, -25, W + 50, H + 50);

    // Banking L.A.P.D. Searchlight Chopper in upper sky
    drawPoliceChopper(ctx, 185 + Math.sin(t * 0.9) * 55, 58, t);

    // Varied L.A. Skyscrapers with stepped roofs, water towers & antennas
    const bldgs = [
      { x: 0, y: 128, w: 72, h: 230, style: 0 },
      { x: 68, y: 98, w: 86, h: 260, style: 1 },
      { x: 150, y: 148, w: 68, h: 210, style: 2 },
      { x: 214, y: 88, w: 96, h: 270, style: 0 },
      { x: 306, y: 118, w: 104, h: 240, style: 1 }
    ];
    for (const b of bldgs) {
      ctx.fillStyle = '#120f1a';
      ctx.fillRect(b.x, b.y, b.w, b.h);
      ctx.strokeStyle = '#292238';
      ctx.lineWidth = 2;
      ctx.strokeRect(b.x, b.y, b.w, b.h);
      ctx.fillStyle = '#191424';
      ctx.fillRect(b.x + 12, b.y - 14, b.w - 24, 14);
      for (let wy = b.y + 16; wy < b.y + b.h - 30; wy += 22) {
        for (let wx = b.x + 10; wx < b.x + b.w - 16; wx += 18) {
          const hash = (wx * 11 + wy * 7) % 9;
          if (hash < 5) {
            ctx.fillStyle = hash === 0 ? '#ff6622' : '#ffbb44';
            ctx.fillRect(wx, wy, b.style === 1 ? 12 : 7, 9);
          }
        }
      }
    }

    // Flickering Neon Martini Sign high on Left Building
    const neonFlicker = Math.sin(t * 28) > -0.6 ? 1 : 0.25;
    ctx.save();
    ctx.globalAlpha = neonFlicker;
    U.drawGlow(ctx, 36, 138, 48, 'rgba(255, 20, 160, 0.52)', 'rgba(255, 0, 128, 0)');
    ctx.strokeStyle = '#ff22aa';
    ctx.lineWidth = 3;
    ctx.strokeRect(12, 104, 48, 66);
    ctx.strokeStyle = '#22ffff';
    ctx.beginPath();
    ctx.moveTo(22, 120); ctx.lineTo(50, 120); ctx.lineTo(36, 138); ctx.closePath();
    ctx.moveTo(36, 138); ctx.lineTo(36, 156);
    ctx.moveTo(26, 156); ctx.lineTo(46, 156);
    ctx.stroke();
    ctx.restore();

    // 2. Cracked Concrete Rooftop Ledge & Neon Wet Puddle Reflections!
    ctx.fillStyle = '#2e313b';
    ctx.fillRect(-20, 345, W + 40, 175);
    ctx.fillStyle = '#434857';
    ctx.fillRect(-20, 345, W + 40, 14);
    ctx.strokeStyle = '#000000';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(-20, 345); ctx.lineTo(W + 20, 345);
    ctx.stroke();

    // Wet neon reflection puddle on rooftop
    U.drawGlow(ctx, 64, 430, 55, 'rgba(255, 34, 170, 0.22)', 'rgba(0,0,0,0)');
    U.drawGlow(ctx, 250, 425, 65, 'rgba(51, 255, 102, 0.18)', 'rgba(0,0,0,0)');

    const barrelX = 334;
    const barrelY = 308;
    if (phase < expStart) {
      ctx.save();
      ctx.translate(barrelX, barrelY);
      U.drawInkedPoly(ctx, [[-18, 0], [18, 0], [18, 46], [-18, 46]], '#d92626', 2.5, '#000');
      ctx.fillStyle = '#ffcc11';
      ctx.fillRect(-17, 13, 34, 18);
      ctx.fillStyle = '#111';
      ctx.beginPath();
      ctx.arc(0, 22, 6, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#33ff44';
      ctx.beginPath();
      ctx.ellipse(0, 0, 16, 4, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }

    // 3. Hovering Octabrain in Upper-Right Sky
    const octaX = 298 + Math.sin(t * 2.5) * 16;
    const octaY = 172;
    if (phase < expStart) {
      drawOctabrain(ctx, octaX, octaY, t);
      if (phase > 0.15 && phase < 0.48) {
        const pp = (phase - 0.15) / 0.33;
        const px = U.lerp(octaX - 20, 140, pp);
        const py = U.lerp(octaY + 10, 240, pp);
        U.drawGlow(ctx, px, py, 16, 'rgba(68, 255, 170, 0.75)', 'rgba(0,0,0,0)');
        ctx.strokeStyle = '#44ffaa';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.ellipse(px, py, 8, 14, 0.3, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    // 4. Charging 3/4-Stance Pig Cop & Shrinker Ray Sequence
    const shrinkStart = 0.18;
    const shrinkEnd = 0.48;
    const stompPhase = 0.65;

    let pigX = 258;
    let pigScale = 1.08;
    let gridAlpha = 0;

    if (phase < shrinkStart) {
      pigX = U.lerp(298, 240, phase / shrinkStart);
      pigScale = 1.08;
    } else if (phase < shrinkEnd) {
      const sp = (phase - shrinkStart) / (shrinkEnd - shrinkStart);
      pigX = U.lerp(240, 172, sp);
      pigScale = U.lerp(1.08, 0.34, U.easeInOutSine(sp));
      gridAlpha = 0.55 + 0.45 * Math.sin(t * 35);
    } else if (phase < stompPhase) {
      const mp = (phase - shrinkEnd) / (stompPhase - shrinkEnd);
      pigX = U.lerp(172, 134, mp);
      pigScale = 0.34;
      gridAlpha = 0.35;
    }

    const pigY = 368 - (1 - pigScale) * 28;
    if (phase < stompPhase) {
      drawPigCop(ctx, pigX, pigY, pigScale, gridAlpha, t);
    } else if (phase < stompPhase + 0.24) {
      const sp = (phase - stompPhase) / 0.24;
      U.drawShockwaveRing(ctx, 134, 378, 48, 14, sp, '51, 255, 102', 4);
      for (let g = 0; g < 9; g++) {
        const a = -Math.PI * 0.1 - (g / 8) * Math.PI * 0.8;
        const r = sp * 54;
        ctx.fillStyle = g % 2 ? '#dd1111' : '#33ff66';
        ctx.beginPath();
        ctx.arc(134 + Math.cos(a) * r, 375 + Math.sin(a) * r, (1 - sp) * 6.5, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // 5. Heroic Duke Nukem in Left Foreground
    const isShrinkerFiring = phase >= shrinkStart && phase < shrinkEnd;
    const rpgFireStart = 0.36;
    const isRpgFiring = phase >= rpgFireStart && phase < rpgFireStart + 0.1;
    let kickProg = 0;
    if (phase >= 0.52 && phase < 0.76) {
      kickProg = Math.sin(((phase - 0.52) / 0.24) * Math.PI);
    }

    drawDukeNukem(ctx, 84, 265, t, kickProg, isShrinkerFiring, isRpgFiring);

    // 6. Emerald-Green Shrinker Ray Volumetric Plasma Stream & Concentric Rings
    if (isShrinkerFiring) {
      const sx = 148;
      const sy = 251;
      const tx = pigX;
      const ty = pigY - 12 * pigScale;

      U.drawVolumetricBeam(ctx, sx, sy, 4, tx, ty, 18, 'rgba(51, 255, 102, 0.65)', 'rgba(0, 255, 120, 0.18)');
      U.drawGlow(ctx, sx, sy, 30, 'rgba(0, 255, 100, 0.95)', 'rgba(0,255,60,0)');
      U.drawGlow(ctx, tx, ty, 52, 'rgba(0, 255, 100, 0.82)', 'rgba(0,255,60,0)');

      ctx.strokeStyle = '#33ff66';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.lineTo(tx, ty);
      ctx.stroke();

      for (let r = 0; r < 5; r++) {
        const rp = ((t * 4 + r * 0.2) % 1);
        const rx = U.lerp(sx, tx, rp);
        const ry = U.lerp(sy, ty, rp);
        ctx.strokeStyle = '#aaffcc';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(rx, ry, 6 + rp * 11, 0, Math.PI * 2);
        ctx.stroke();
      }
    }

    // 7. RPG Rocket Launch & Massive Build-Engine Multi-Fireball Explosion
    if (phase >= rpgFireStart && phase < expStart) {
      const rp = (phase - rpgFireStart) / (expStart - rpgFireStart);
      const rx = U.lerp(148, octaX, rp);
      const ry = U.lerp(222, octaY + 25, rp);

      for (let k = 1; k <= 7; k++) {
        const kp = Math.max(0, rp - k * 0.045);
        const kx = U.lerp(148, octaX, kp);
        const ky = U.lerp(222, octaY + 25, kp);
        ctx.fillStyle = `rgba(200, 200, 210, ${(1 - k / 8) * 0.55})`;
        ctx.beginPath();
        ctx.arc(kx, ky, 4 + k * 1.8, 0, Math.PI * 2);
        ctx.fill();
      }

      U.drawGlow(ctx, rx, ry, 26, 'rgba(255, 170, 30, 0.95)', 'rgba(255,50,0,0)');
      ctx.save();
      ctx.translate(rx, ry);
      ctx.rotate(-0.18);
      ctx.fillStyle = '#d9d9d9';
      ctx.fillRect(-10, -3.5, 18, 7);
      ctx.fillStyle = '#cc2222';
      ctx.beginPath();
      ctx.moveTo(8, -4); ctx.lineTo(15, 0); ctx.lineTo(8, 4); ctx.fill();
      ctx.restore();
    } else if (isExploding) {
      const ep = (phase - expStart) / 0.32;
      const ex = 305;
      const ey = 235;

      U.drawShockwaveRing(ctx, ex, ey, 138, 138, ep, '255, 200, 90', 6);
      U.drawSpeedLines(ctx, ex, ey, 35, 160, 18, '#ffdd66', (1 - ep) * 0.7, 404);
      U.drawGlow(ctx, ex, ey, 155 * (1 - ep * 0.3), `rgba(255, 130, 10, ${1 - ep})`, 'rgba(255, 20, 0, 0)');

      for (let i = 0; i < 12; i++) {
        const a = i * 1.1 + ep * 1.8;
        const dist = ep * (25 + (i % 4) * 22);
        const px = ex + Math.cos(a) * dist;
        const py = ey + Math.sin(a) * dist - ep * 25;
        const rad = (1 - ep * 0.85) * (38 - (i % 3) * 7);
        ctx.fillStyle = i % 3 === 0 ? '#ffee55' : (i % 3 === 1 ? '#ff6600' : '#332222');
        ctx.beginPath();
        ctx.arc(px, py, Math.max(1, rad), 0, Math.PI * 2);
        ctx.fill();
      }

      for (let s = 0; s < 12; s++) {
        const sa = s * 0.55 + 0.2;
        const sr = ep * (60 + (s % 3) * 38);
        const sx = ex + Math.cos(sa) * sr;
        const sy = ey + Math.sin(sa) * sr;
        ctx.save();
        ctx.translate(sx, sy);
        ctx.rotate(ep * 12 * (s % 2 ? 1 : -1));
        U.drawInkedPoly(ctx, [[-6, -3], [7, 0], [-2, 6]], s % 2 ? '#55ffff' : '#ffcc22', 1, '#000');
        ctx.restore();
      }
    }

    // 8. Atmospheric L.A. Nocturnal Rain Streaks across rooftop
    ctx.strokeStyle = 'rgba(180, 210, 255, 0.22)';
    ctx.lineWidth = 1.2;
    for (let r = 0; r < 22; r++) {
      const rx = ((r * 67 - t * 90) % W + W) % W;
      const ry = ((r * 89 + t * 320) % H);
      ctx.beginPath();
      ctx.moveTo(rx, ry);
      ctx.lineTo(rx - 5, ry + 18);
      ctx.stroke();
    }

    ctx.restore();
    U.drawCinematicVignette(ctx, W, H, 0.36);
  };
})();

<script>
// Game 5: StarCraft (1998) — UPGRADED MASTERPIECE EDITION
// Iconic Moment: Isometric 3-way Brood War clash on a craggy Char/Badlands high-ground cliff ramp —
// Terran Arclite Siege Tanks in Siege Mode, a firing Terran Bunker, glowing blue Mineral Fields, and
// Stimpacked Marines hold the ramp against a 1.45x-scaled Zergling & cobra-hooded Hydralisk rush backed
// by an organic veined Zerg Creep & Sunken Colony, while a Protoss Pylon, Zealots with glowing Psi-Blades,
// a fierce fractal-plasma Archon, and a High Templar's Psionic Storm obliterate the swarm!
(function() {
  const U = window.GameAnimUtils;

  function drawSCSelection(ctx, x, y, rx, ry, segments, hpRatio) {
    ctx.strokeStyle = '#18ff38';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
    ctx.stroke();

    const bw = segments * 4;
    const bx = x - bw / 2;
    const by = y + ry + 5;
    ctx.fillStyle = '#000000';
    ctx.fillRect(bx - 1, by - 1, bw + 2, 5);
    const activeSegs = Math.round(segments * hpRatio);
    for (let i = 0; i < segments; i++) {
      ctx.fillStyle = i < activeSegs ? (hpRatio > 0.5 ? '#18ff38' : '#ffcc00') : '#222822';
      ctx.fillRect(bx + i * 4, by, 3, 3);
    }
  }

  // Draw Glowing Blue StarCraft Mineral Crystal Patch on High Ground
  function drawMineralField(ctx, x, y) {
    ctx.save();
    ctx.translate(x, y);
    const crystals = [
      [[-18, 4], [-12, -16], [-4, 2]],
      [[-8, 6], [0, -22], [8, 4]],
      [[4, 6], [14, -14], [18, 4]],
      [[-12, 8], [-2, -10], [8, 8]]
    ];
    for (let i = 0; i < crystals.length; i++) {
      U.drawInkedPoly(ctx, crystals[i], i % 2 === 0 ? '#1ca3ec' : '#66ddff', 1.5, '#072a47');
    }
    ctx.restore();
  }

  // Draw Terran Bunker on High Ground blasting continuous C-14 Gauss Rifle muzzle flashes!
  function drawTerranBunker(ctx, x, y, t) {
    ctx.save();
    ctx.translate(x, y);
    drawSCSelection(ctx, 0, 8, 38, 22, 12, 0.92);

    // Octagonal reinforced steel bunker base & sloped roof
    U.drawInkedPoly(
      ctx,
      [[-30, -6], [-18, -20], [18, -20], [30, -6], [26, 14], [-26, 14]],
      '#5c6675',
      2.2,
      '#14181f'
    );
    // Blue Terran team armor stripes & domed roof hatch
    U.drawInkedPoly(ctx, [[-18, -16], [18, -16], [22, -4], [-22, -4]], '#1e5ce6', 1.5, '#0d2666');
    ctx.fillStyle = '#7c8799';
    ctx.fillRect(-12, -14, 24, 8);

    // Dark firing slits & rapid Gauss Rifle muzzle flashes!
    ctx.fillStyle = '#0c0e12';
    ctx.fillRect(-18, -2, 36, 5);
    for (let m = 0; m < 3; m++) {
      if (Math.sin(t * 36 + m * 2.1) > -0.1) {
        const mx = -10 + m * 12;
        const my = 2;
        U.drawGlow(ctx, mx + 12, my, 14, 'rgba(140, 225, 255, 0.95)', 'rgba(0, 120, 255, 0)');
        U.drawStarFlare(ctx, mx + 12, my, 9, 2.5, 4, '#ffffff', t * 12 + m);
      }
    }
    ctx.restore();
  }

  // Draw Crystalline Protoss Pylon on Top-Right Flank
  function drawProtossPylon(ctx, x, y, t) {
    ctx.save();
    ctx.translate(x, y);
    const pulse = 0.85 + 0.15 * Math.sin(t * 5);
    U.drawGlow(ctx, 0, -10, 44 * pulse, 'rgba(0, 210, 255, 0.55)', 'rgba(0, 80, 255, 0)');

    // Golden Pylon base & floating cyan crystal core
    U.drawInkedPoly(ctx, [[-18, 8], [0, 16], [18, 8], [12, -4], [-12, -4]], '#d9a621', 1.8, '#3d2c05');
    U.drawInkedPoly(ctx, [[-11, -2], [0, -28], [11, -2], [0, 8]], '#00eeff', 1.8, '#004477');
    U.drawInkedPoly(ctx, [[0, -28], [11, -2], [0, 8]], '#88ffff', 0, 'transparent');
    ctx.restore();
  }

  // Draw Zerg Sunken Colony on Bottom-Right Creep with impaling subterranean tentacle!
  function drawSunkenColony(ctx, x, y, t) {
    ctx.save();
    ctx.translate(x, y);
    const throb = 1 + Math.sin(t * 6) * 0.06;
    ctx.scale(throb, 1 / throb);

    // Fleshy ribbed purple-brown Zerg structure mounds
    for (let a = 0; a < 6; a++) {
      const ang = (a * Math.PI) / 3;
      ctx.fillStyle = a % 2 ? '#6e1d4f' : '#8a3224';
      ctx.beginPath();
      ctx.arc(Math.cos(ang) * 14, Math.sin(ang) * 9, 11, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#240818';
      ctx.lineWidth = 1.8;
      ctx.stroke();
    }
    // Central maw & whipping spine tentacle
    ctx.fillStyle = '#3d0a24';
    ctx.beginPath();
    ctx.ellipse(0, 0, 12, 8, 0, 0, Math.PI * 2);
    ctx.fill();
    U.drawInkedPoly(
      ctx,
      [[-5, 0], [-14 + Math.sin(t * 9) * 8, -32], [4, 0]],
      '#c95b42',
      2,
      '#240818'
    );
    ctx.restore();
  }

  function drawSiegeTank(ctx, x, y, turretAngle, recoil, firing) {
    ctx.save();
    ctx.translate(x, y);
    drawSCSelection(ctx, 0, 6, 36, 20, 10, 0.95);

    const struts = [[-30, -11], [26, -13], [-28, 17], [28, 15]];
    ctx.strokeStyle = '#5c6675';
    ctx.lineWidth = 5.5;
    for (const [sx, sy] of struts) {
      ctx.beginPath();
      ctx.moveTo(0, 0); ctx.lineTo(sx, sy);
      ctx.stroke();
      ctx.fillStyle = '#363d47';
      ctx.beginPath();
      ctx.ellipse(sx, sy, 7.5, 5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#15181c';
      ctx.lineWidth = 1.5;
      ctx.stroke();
      ctx.strokeStyle = '#5c6675';
      ctx.lineWidth = 5.5;
    }

    U.drawInkedPoly(ctx, [[-24, -9], [20, -13], [26, 7], [-18, 13]], '#6b7585', 2, '#14181f');
    U.drawInkedPoly(ctx, [[-17, -7], [13, -10], [17, 4], [-13, 9]], '#1e5ce6', 1.5, '#0d2666');

    ctx.save();
    ctx.rotate(turretAngle);
    ctx.translate(-recoil * 7, 0);

    U.drawInkedPoly(ctx, [[-19, -10], [9, -10], [13, 10], [-19, 10]], '#8894a6', 2, '#14181f');
    ctx.fillStyle = '#2466ff';
    ctx.fillRect(-14, -6.5, 15, 13);

    ctx.fillStyle = '#aeb9c9';
    ctx.fillRect(9, -6, 30, 5);
    ctx.fillRect(9, 1, 30, 5);
    ctx.strokeStyle = '#14181f';
    ctx.lineWidth = 1.5;
    ctx.strokeRect(9, -6, 30, 5);
    ctx.strokeRect(9, 1, 30, 5);

    if (firing) {
      U.drawGlow(ctx, 44, 0, 34, 'rgba(255, 230, 120, 0.95)', 'rgba(255, 100, 0, 0)');
      U.drawStarFlare(ctx, 44, 0, 26, 6, 6, '#ffffff', recoil);
    }
    ctx.restore();
    ctx.restore();
  }

  // Scaled-up & Articulated Stimpacked Terran Marine in CMC-300 Power Armor
  function drawTerranMarine(ctx, x, y, t, seed) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(1.25, 1.25);
    drawSCSelection(ctx, 0, 4, 15, 9, 5, 0.85);

    // Oversized rounded CMC-300 power armor pauldrons & backpack
    ctx.fillStyle = '#1e5ce6';
    ctx.beginPath();
    ctx.arc(-7, -10, 7, 0, Math.PI * 2);
    ctx.arc(7, -10, 7, 0, Math.PI * 2);
    ctx.roundRect(-9, -13, 18, 16, 4);
    ctx.fill();
    ctx.strokeStyle = '#0a193d';
    ctx.lineWidth = 1.6;
    ctx.stroke();

    // Gold/amber combat visor dome
    ctx.fillStyle = '#ffaa22';
    ctx.beginPath();
    ctx.arc(1, -13, 5, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // C-14 Impaler Gauss Rifle & Muzzle Spark
    ctx.fillStyle = '#8c96a8';
    ctx.fillRect(2, -9, 17, 4.5);
    ctx.strokeRect(2, -9, 17, 4.5);
    if (Math.sin(t * 32 + seed) > 0) {
      U.drawGlow(ctx, 22, -7, 12, 'rgba(130, 220, 255, 0.95)', 'rgba(0, 120, 255, 0)');
      U.drawStarFlare(ctx, 22, -7, 8, 2, 4, '#ffffff', t * 10);
    }
    ctx.restore();
  }

  // Sculpted 1.4x Zerg Hydralisk (Curved cobra-hood crest, skeletal chitin ribs, twin scythe-claws)
  function drawHydralisk(ctx, x, y, t, seed) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(1.32, 1.32);
    const slither = Math.sin(t * 8 + seed) * 3;
    drawSCSelection(ctx, 0, 7, 20, 11, 7, 0.72);

    // Coiled serpentine tail with chitin segments
    ctx.strokeStyle = '#6e3b1e';
    ctx.lineWidth = 7.5;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(0, 4);
    ctx.quadraticCurveTo(14, 11 + slither, 24, 4 - slither);
    ctx.stroke();

    // S-curved ribbed spine & flared Cobra-Hood Crest!
    U.drawInkedPoly(ctx, [[10, 4], [8, -14], [-4, -24], [-16, -20], [-8, -6], [2, 6]], '#8c4b27', 2, '#240f04');
    // Chitin rib stripes on torso
    ctx.strokeStyle = '#d9b88c';
    ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.moveTo(-4, -12); ctx.lineTo(5, -10);
    ctx.moveTo(-2, -7); ctx.lineTo(6, -5);
    ctx.stroke();

    // Purple Zerg brood carapace markings on hood
    ctx.fillStyle = '#a329d9';
    ctx.beginPath();
    ctx.arc(-4, -17, 5, 0, Math.PI * 2);
    ctx.fill();

    // Twin Bone Scythe Claws & glowing yellow eyes
    U.drawInkedPoly(ctx, [[-6, -12], [-22, -9], [-14, -2]], '#e8d8b8', 1.5, '#240f04');
    U.drawInkedPoly(ctx, [[-4, -7], [-18, -2], [-10, 3]], '#e8d8b8', 1.5, '#240f04');
    ctx.fillStyle = '#ffee33';
    ctx.fillRect(-12, -19, 3.5, 2.5);

    // Spitting acid-green needle spine projectile!
    const spitProg = ((t * 2.8 + seed * 0.3) % 1);
    if (spitProg < 0.7) {
      const sx = U.lerp(-20, -88, spitProg / 0.7);
      const sy = U.lerp(-12, -26, spitProg / 0.7);
      ctx.strokeStyle = '#55ff22';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(sx, sy); ctx.lineTo(sx + 12, sy + 2);
      ctx.stroke();
    }
    ctx.restore();
  }

  // Sculpted 1.35x Zergling (4 clawed legs, segmented carapace, dorsal adrenal wing-sickles & fangs)
  function drawZergling(ctx, x, y, t, seed) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(1.32, 1.32);
    const leap = Math.abs(Math.sin(t * 12 + seed)) * 5;
    ctx.translate(0, -leap);

    // 4 scuttling legs
    ctx.strokeStyle = '#592b12';
    ctx.lineWidth = 2.2;
    for (let lx of [-6, 4]) {
      ctx.beginPath();
      ctx.moveTo(lx, -2); ctx.lineTo(lx - 4, 6);
      ctx.moveTo(lx + 2, -2); ctx.lineTo(lx + 6, 5);
      ctx.stroke();
    }

    // Hunched segmented Zergling body & tail spike
    U.drawInkedPoly(ctx, [[-12, -3], [-2, -10], [10, -7], [16, -2], [6, 2], [-8, 2]], '#9c5024', 1.6, '#240f04');
    // Dorsal metabolic sickle blades
    U.drawInkedPoly(ctx, [[0, -9], [11, -18], [7, -7]], '#e6d5b8', 1.4, '#240f04');
    // Fore-claws
    ctx.strokeStyle = '#e6d5b8';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(-10, -3); ctx.lineTo(-17, 2);
    ctx.stroke();
    ctx.restore();
  }

  // Sculpted 1.3x Protoss Zealot (Golden Khalai armor pauldrons, glowing cyan Psi-Blades)
  function drawProtossZealot(ctx, x, y, t) {
    ctx.save();
    ctx.translate(x, y);
    ctx.scale(1.28, 1.28);
    drawSCSelection(ctx, 0, 5, 17, 10, 8, 0.90);

    // Swept-back golden Protoss pauldrons & crest
    U.drawInkedPoly(ctx, [[-15, -15], [0, -20], [15, -15], [9, 4], [-9, 4]], '#e6b822', 2, '#3d2c05');
    ctx.fillStyle = '#2288ff';
    ctx.beginPath();
    ctx.arc(0, -10, 4, 0, Math.PI * 2);
    ctx.fill();

    const slash = Math.sin(t * 14) * 0.65;
    for (let s of [-1, 1]) {
      ctx.save();
      ctx.translate(s * 11, -8);
      ctx.rotate(s * 0.4 + slash);
      U.drawGlow(ctx, 0, 10, 16, 'rgba(0, 238, 255, 0.85)', 'rgba(0, 120, 255, 0)');
      ctx.strokeStyle = '#00eeff';
      ctx.lineWidth = 4.2;
      ctx.beginPath();
      ctx.moveTo(0, 0); ctx.lineTo(s * 7, 19);
      ctx.stroke();
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 1.8;
      ctx.stroke();
      ctx.restore();
    }
    ctx.restore();
  }

  // Re-Sculpted Protoss Archon (Fierce dark armored psionic entity inside a multi-layered fractal plasma vortex!)
  function drawProtossArchon(ctx, x, y, t) {
    ctx.save();
    ctx.translate(x, y);
    drawSCSelection(ctx, 0, 18, 30, 16, 10, 1.0);

    // Blinding outer psionic plasma corona
    U.drawGlow(ctx, 0, -8, 56, 'rgba(50, 190, 255, 0.92)', 'rgba(10, 60, 255, 0)');
    U.drawGlow(ctx, 0, -8, 30, 'rgba(220, 250, 255, 0.95)', 'rgba(0, 180, 255, 0)');

    // Jagged crackling plasma tendrils radiating outward (NOT a smooth snowball!)
    for (let i = 0; i < 6; i++) {
      const a = t * 3 + (i * Math.PI) / 3;
      U.drawLightning(
        ctx,
        0, -8,
        Math.cos(a) * 28, -8 + Math.sin(a) * 22,
        4, 8, 2.5,
        '#ffffff', '#00eeff',
        Math.floor(t * 20) + i * 11
      );
    }

    // Orbiting energy rings
    for (let i = 0; i < 3; i++) {
      ctx.save();
      ctx.rotate(t * (3 + i * 0.8) + i);
      ctx.strokeStyle = i % 2 ? '#ffffff' : '#00eeff';
      ctx.lineWidth = 2.4;
      ctx.beginPath();
      ctx.ellipse(0, -8, 28, 11, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    // Jagged Dark-Blue Armored Psionic Being Silhouette at Center of Vortex!
    U.drawInkedPoly(
      ctx,
      [[-14, -14], [-6, -24], [0, -18], [6, -24], [14, -14], [8, 4], [0, 10], [-8, 4]],
      '#0b2247',
      1.8,
      '#88ffff'
    );
    // Fierce angled psionic eye slits
    ctx.fillStyle = '#ffffff';
    ctx.beginPath();
    ctx.moveTo(-7, -13); ctx.lineTo(-2, -11); ctx.lineTo(-6, -9); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(7, -13); ctx.lineTo(2, -11); ctx.lineTo(6, -9); ctx.fill();

    // Archon shockwave beam hitting nearby Zerg!
    if (Math.sin(t * 7) > -0.2) {
      U.drawLightning(ctx, 0, 2, 16, 46, 6, 10, 3.2, '#ffffff', '#00eeff', Math.floor(t * 24));
    }
    ctx.restore();
  }

  window.GameAnimations.game5 = function(ctx, W, H, t) {
    const loop = 5.5;
    const phase = U.getPhase(4, t, loop);

    const siegeFire1 = phase >= 0.30 && phase < 0.42;
    const siegeFire2 = phase >= 0.58 && phase < 0.70;
    const isArtilleryHit = (phase >= 0.30 && phase < 0.52) || (phase >= 0.58 && phase < 0.80);
    const shake = isArtilleryHit ? Math.sin(t * 60) * 4.5 : 0;

    // Dynamic RTS camera pushing into the Badlands choke ramp during Psionic Storm & Siege Tank barrage
    const stormFocus = (phase >= 0.20 && phase < 0.82)
      ? Math.sin(((phase - 0.20) / 0.62) * Math.PI)
      : 0;
    const camX = W * 0.5 + stormFocus * 14 + shake;
    const camY = H * 0.5 + stormFocus * 6 - shake * 0.6;
    const camZoom = 1.0 + stormFocus * 0.065;

    ctx.save();
    U.applySceneCamera(ctx, W, H, camX, camY, camZoom, 0);

    // 1. Isometric Badlands / Char Low-Ground & Craggy Stepped High-Ground Cliff Face
    ctx.fillStyle = '#3d2517';
    ctx.fillRect(-20, -20, W + 40, H + 40);

    for (let i = 0; i < 28; i++) {
      ctx.fillStyle = i % 2 ? '#4d301e' : '#331e12';
      ctx.fillRect((i * 83) % W, (i * 67) % H, 26, 12);
    }

    // High-Ground Plateau on Left with Multi-Faceted Craggy Cliff Wall & Recessed Dirt Ramp!
    U.drawInkedPoly(
      ctx,
      [[-20, -20], [190, -20], [208, 95], [192, 162], [136, 258], [168, 345], [160, 520], [-20, 520]],
      '#69452e',
      0,
      'transparent'
    );

    const upperCliff = [[190, 0], [218, 14], [232, 102], [216, 174], [192, 162], [208, 95]];
    U.drawInkedPoly(ctx, upperCliff, '#2e1b10', 2.2, '#140b06');
    ctx.strokeStyle = '#4a2c1b';
    ctx.lineWidth = 2;
    for (let cy = 18; cy < 155; cy += 22) {
      ctx.beginPath();
      ctx.moveTo(196, cy); ctx.lineTo(222, cy + 12);
      ctx.stroke();
    }

    const lowerCliff = [[136, 258], [162, 270], [192, 355], [186, 520], [160, 520], [168, 345]];
    U.drawInkedPoly(ctx, lowerCliff, '#2e1b10', 2.2, '#140b06');
    for (let cy = 280; cy < 485; cy += 24) {
      ctx.beginPath();
      ctx.moveTo(164, cy); ctx.lineTo(188, cy + 12);
      ctx.stroke();
    }

    // Stepped Dirt Chokepoint Ramp between the two cliff walls (`y = 162..268`)
    U.drawInkedPoly(ctx, [[192, 162], [235, 185], [185, 275], [136, 258]], '#593924', 1.5, '#2e1b10');
    ctx.strokeStyle = '#754d32';
    ctx.lineWidth = 2;
    for (let s = 0; s < 4; s++) {
      const sy = 180 + s * 20;
      ctx.beginPath();
      ctx.moveTo(155 + s * 6, sy); ctx.lineTo(198 + s * 6, sy + 18);
      ctx.stroke();
    }

    // Glowing Blue Mineral Crystal Patches + Harvesting SCV Fusion-Cutter Sparks on Top-Left!
    U.drawGlow(ctx, 52, 40, 46, 'rgba(30, 180, 255, 0.42)', 'rgba(0,0,0,0)');
    drawMineralField(ctx, 32, 46);
    drawMineralField(ctx, 72, 34);
    if (Math.sin(t * 24) > 0) {
      U.drawStarFlare(ctx, 48, 44, 9, 2.5, 4, '#88ffff', t * 8);
    }

    // Organic Veined Purple Zerg Creep & Sunken Colony on Bottom-Right!
    ctx.save();
    const creepGrad = ctx.createRadialGradient(345, 395, 25, 315, 360, 185);
    creepGrad.addColorStop(0, '#6b1952');
    creepGrad.addColorStop(0.7, '#451035');
    creepGrad.addColorStop(1, 'rgba(69, 16, 53, 0)');
    ctx.fillStyle = creepGrad;
    ctx.beginPath();
    ctx.arc(315, 360, 185, 0, Math.PI * 2);
    ctx.fill();

    ctx.strokeStyle = '#8c246b';
    ctx.lineWidth = 2.5;
    for (let v = 0; v < 8; v++) {
      const a = Math.PI * 0.65 + (v / 7) * Math.PI * 0.85;
      ctx.beginPath();
      ctx.moveTo(355, 420);
      ctx.quadraticCurveTo(355 + Math.cos(a) * 75, 420 + Math.sin(a) * 65, 355 + Math.cos(a) * 145, 420 + Math.sin(a) * 145);
      ctx.stroke();
    }
    ctx.restore();

    drawSunkenColony(ctx, 358, 442, t);

    // 2. Terran High-Ground Defense Line (Terran Bunker + 2 Deployed Siege Tanks + Stimpacked Marines)
    const recoil1 = siegeFire1 ? Math.sin(((phase - 0.30) / 0.12) * Math.PI) : 0;
    const recoil2 = siegeFire2 ? Math.sin(((phase - 0.58) / 0.12) * Math.PI) : 0;

    drawTerranBunker(ctx, 138, 108, t);
    drawSiegeTank(ctx, 64, 155, 0.35 + Math.sin(t * 1.5) * 0.08, recoil1, siegeFire1);
    drawSiegeTank(ctx, 74, 365, -0.25 + Math.cos(t * 1.5) * 0.08, recoil2, siegeFire2);

    drawTerranMarine(ctx, 142, 198, t, 1);
    drawTerranMarine(ctx, 162, 232, t, 2);
    drawTerranMarine(ctx, 128, 252, t, 3);

    // 3. Protoss Flank (Crystalline Pylon + Fractal Archon + Zealots)
    drawProtossPylon(ctx, 354, 58, t);
    drawProtossArchon(ctx, 258 + Math.sin(t * 2) * 8, 92, t);
    drawProtossZealot(ctx, 232, 164, t);
    drawProtossZealot(ctx, 292, 148, t + 1.5);

    // 4. Zerg Swarm (Scaled-up Zerglings & Cobra-Hooded Hydralisks)
    const zergs = [
      { bx: 245, by: 235, seed: 1 },
      { bx: 278, by: 265, seed: 2 },

        U.drawStarFlare(ctx, imp.x, imp.y, 44 * (1 - ip), 12 * (1 - ip), 6, '#ffffff', ip * 4);
      }

      U.drawVolumetricBeam(ctx, lx, -10, 6, lx, 265, 14, 'rgba(255, 180, 30, 0.55)', 'rgba(255, 60, 0, 0.15)');

      ctx.moveTo(lx, 0);
      ctx.lineTo(lx + Math.sin(t * 8 + lx) * 3, 255);

    }

    U.drawInkedPoly(ctx, [[-15, -15], [95, -15], [55, 145], [-15, 210]], '#1f0c08', 2, '#000');

    // 2. Churning Magma Pool & Ragnaros the Firelord

    lavaGrad.addColorStop(0, '#ffee55');
    lavaGrad.addColorStop(0.45, '#ff5500');
    lavaGrad.addColorStop(0.85, '#8a1400');
    lavaGrad.addColorStop(1, '#260702');
    ctx.fillStyle = lavaGrad;
    ctx.beginPath();
    ctx.ellipse(W / 2, 290, 195, 68, 0, 0, Math.PI * 2);
    ctx.fill();

    drawRagnaros(ctx, W / 2 - 10, 245, t, slamProgress);

    // Wrath of Ragnaros Lava Eruption Geyser & Flying Magma Meteors on Sulfuras Slam
    if (isSlamImpact) {
      const ep = (phase - slamMoment) / 0.32;
      const slamX = W / 2 + 78;
      const slamY = 265;

      U.drawShockwaveRing(ctx, slamX, slamY, 175, 58, ep, '255, 220, 80', 7);
      U.drawSpeedLines(ctx, slamX, slamY, 35, 165, 16, '#ffbb33', (1 - ep) * 0.68, 606);
      U.drawGlow(ctx, slamX, slamY, 145 * (1 - ep * 0.3), `rgba(255, 200, 40, ${1 - ep})`, 'rgba(255, 40, 0, 0)');

      for (let m = 0; m < 10; m++) {
        const a = -Math.PI * 0.12 - (m / 9) * Math.PI * 0.76;
        const dist = ep * (85 + (m % 3) * 48);
        const mx = slamX + Math.cos(a) * dist;
        const my = slamY + Math.sin(a) * dist + ep * ep * 55;
        U.drawGlow(ctx, mx, my, 24 * (1 - ep * 0.5), 'rgba(255, 120, 0, 0.92)', 'rgba(255,0,0,0)');
        ctx.fillStyle = '#ffee55';
        ctx.beginPath();
        ctx.arc(mx, my, 7.5 * (1 - ep * 0.4), 0, Math.PI * 2);
        ctx.fill();
      }
      if (ep < 0.45) {
        U.drawStarFlare(ctx, slamX, slamY, 54 * (1 - ep * 2), 14, 8, '#ffffff', ep * 4);
      }
    }

    // 3. Thunderfury Chain-Lightning Cyclone Proc
    const tfProc = phase >= 0.16 && phase < 0.48;
    if (tfProc) {

      ctx.fillStyle = e.size > 3 ? '#ffee55' : '#ff6600';
      ctx.beginPath();
      ctx.arc(ex, ey, e.size, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();
    U.drawCinematicVignette(ctx, W, H, 0.36);

  window.GameAnimations.game7 = function(ctx, W, H, t) {

    const vatsAlpha = isVats ? Math.sin(((phase - vatsStart) / (firePhase - vatsStart)) * Math.PI * 0.95) : 0;

      stemGrad.addColorStop(0.55, '#d94b0f');
      stemGrad.addColorStop(1, '#3d281c');
      ctx.fillStyle = stemGrad;
      ctx.beginPath();
      ctx.moveTo(ex - 48, ey + 24);
      ctx.quadraticCurveTo(ex - 18, ey - stemH * 0.5, ex - 34, capY + 10);
      ctx.lineTo(ex + 34, capY + 10);
      ctx.quadraticCurveTo(ex + 18, ey - stemH * 0.5, ex + 48, ey + 24);

      ctx.fill();

      ctx.strokeStyle = `rgba(255, 245, 220, ${(1 - detProg) * 0.78})`;
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.ellipse(ex, capY + 26, capR * 0.72, 11, 0, 0, Math.PI * 2);
      ctx.stroke();

      // Layer 1 (Back/Outer): Billowing dark scorched smoke clouds framing top & outer torus rim
      ctx.fillStyle = '#2e201a';
      const smokeLobes = [
        [-capR * 0.78, 8, 28], [capR * 0.78, 8, 28],
        [-capR * 0.52, -16, 32], [capR * 0.52, -16, 32],
        [0, -28, 36]
      ];
      for (const [ox, oy, r] of smokeLobes) {
        ctx.beginPath();
        ctx.arc(ex + ox, capY + oy, r * (1 - detProg * 0.2), 0, Math.PI * 2);
        ctx.fill();
      }

      // Layer 2 (Mid): Roiling fiery orange-red plasma clouds inside the mushroom cap

      fireGrad.addColorStop(0.45, '#ff9911');
      fireGrad.addColorStop(0.85, '#cc2900');
      fireGrad.addColorStop(1, '#3d160a');
      ctx.fillStyle = fireGrad;
      const fireLobes = [
        [-capR * 0.62, 6, 26], [capR * 0.62, 6, 26],
        [-capR * 0.35, -12, 30], [capR * 0.35, -12, 30],
        [0, -18, 34], [0, 4, 30]
      ];
      for (const [ox, oy, r] of fireLobes) {
        ctx.beginPath();
        ctx.arc(ex + ox, capY + oy, r * (1 - detProg * 0.2), 0, Math.PI * 2);

      // Layer 3 (Core): Blinding incandescent yellow-white nuclear heart
      ctx.fillStyle = `rgba(255, 250, 190, ${1 - detProg * 0.5})`;
      ctx.beginPath();
      ctx.ellipse(ex, capY - 6, capR * 0.45, capR * 0.26, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    // 4. Foreground Brotherhood of Steel T-45d Power Armor & Fat Man Launcher
    const recoil = (phase >= firePhase && phase < firePhase + 0.08)

    // 5. Slow-Motion Fat Man Mini-Nuke Projectile in Flight
    if (phase >= firePhase && phase < nukeImpact) {

      const ny = U.lerp(348, behemothY - 48, np) - 4 * np * (1 - np) * 95;
      const angle = Math.atan2((behemothY - 48) - 348 + (0.5 - np) * 190, behemothX - 158);

      for (let r = 1; r <= 5; r++) {
        const rp = Math.max(0, np - r * 0.055);
        const rx = U.lerp(158, behemothX, rp);
        const ry = U.lerp(348, behemothY - 48, rp) - 4 * rp * (1 - rp) * 95;

        ctx.beginPath();
        ctx.ellipse(rx, ry, 5, 12, angle, 0, Math.PI * 2);
        ctx.stroke();
      }

      ctx.save();
      ctx.translate(nx, ny);
      ctx.rotate(angle);
      U.drawInkedPoly(ctx, [[-14, -9], [-6, -4], [-6, 4], [-14, 9]], '#3d4736', 1.5, '#000');
      ctx.fillStyle = '#556347';
      ctx.beginPath();
      ctx.ellipse(2, 0, 12, 7.5, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#111';
      ctx.lineWidth = 1.8;
      ctx.stroke();
      ctx.fillStyle = '#ffcc22';
      ctx.fillRect(6, -5, 3, 10);
      ctx.restore();
    }

    if (isVats) {
      ctx.fillStyle = 'rgba(20, 255, 110, 0.08)';
      ctx.fillRect(-10, -10, W + 20, H + 20);
      ctx.strokeStyle = 'rgba(43, 255, 136, 0.62)';
      ctx.lineWidth = 2.2;
      ctx.strokeRect(14, 14, W - 28, H - 28);
    }

    ctx.fillStyle = 'rgba(190, 210, 175, 0.48)';
    for (const a of ashParticles) {
      const ax = (a.x + t * a.vx) % W;
      const ay = (a.y + t * a.vy) % H;
      ctx.fillRect(ax, ay, a.s, a.s);
    }

    ctx.restore();
    U.drawCinematicVignette(ctx, W, H, 0.36);
  };

    U.drawGlow(ctx, W / 2, dolmenY - 12, 78, 'rgba(0, 210, 255, 0.8)', 'rgba(0, 100, 255, 0)');
    ctx.strokeStyle = '#00eeff';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.ellipse(W / 2, dolmenY + 6, 88, 16, 0, 0, Math.PI * 2);
    ctx.stroke();

    const pinions = [
      { x: 76, y: 280, ox: 136, oy: 82 },
      { x: 140, y: 264, ox: 172, oy: 86 },
      { x: 260, y: 264, ox: 228, oy: 86 },
      { x: 324, y: 280, ox: 264, oy: 82 }
    ];

    // 3. Four Colossal Interlocking Cold-Iron Chains Plunging from Sky Anchor into Pinions!
    for (let i = 0; i < pinions.length; i++) {
      const p = pinions[i];
      const dropStart = i * 0.06;
      const chainProg = U.clamp((phase - dropStart) / 0.20, 0, 1);
      drawDaedricChain(ctx, p.ox, p.oy, p.x, p.y, chainProg > 0 ? chainProg : 1);

      U.drawInkedPoly(ctx, [[p.x - 11, p.y + 16], [p.x - 7, p.y - 18], [p.x + 7, p.y - 18], [p.x + 11, p.y + 16]], '#384254', 2.2, '#090c12');

      if (phase >= dropStart + 0.18 && phase < dropStart + 0.44) {
        const sp = (phase - (dropStart + 0.18)) / 0.26;
        U.drawGlow(ctx, p.x, p.y, 52 * (1 - sp), 'rgba(0, 238, 255, 0.95)', 'rgba(0, 100, 255, 0)');
        U.drawShockwaveRing(ctx, p.x, p.y, 48, 18, sp, '0, 238, 255', 3.5);
        U.drawStarFlare(ctx, p.x, p.y, 30 * (1 - sp), 6, 4, '#ffffff', sp * 4);
      }
    }

    // Sculpted Horned Daedric Harvester Titan at Center of Dolmen!
    drawDaedricTitan(ctx, W / 2, dolmenY - 28, t);

    // 4. Foreground Stone Keep Steps & The Three Sculpted Alliance Heroes
    U.drawInkedPoly(ctx, [[-35, 365], [435, 365], [435, 535], [-35, 535]], '#1d222b', 3, '#080a0d');
    drawThreeAllianceHeroes(ctx, t);

    // 5. Hero Ultimate Abilities Clashing Against the Dark Anchor!
    // Left Altmer Sorceress: Branching Violet-Blue Storm Calling Lightning
    if (Math.sin(t * 9) > -0.3 || (phase >= 0.28 && phase < 0.85)) {
      U.drawLightning(ctx, 48, 324, W / 2 - 12, dolmenY - 48, 7, 18, 3.4, '#ffffff', '#8844ff', Math.floor(t * 24));
    }

    // Center Nord Dragonknight: Fiery Grip Molten Magma Whip & Dragonfire Eruption!
    if (phase >= 0.22 && phase < 0.88) {
      const dp = (phase - 0.22) / 0.66;
      const whipX = U.lerp(200, W / 2 + 8, Math.min(1, dp * 2));
      const whipY = U.lerp(330, dolmenY - 44, Math.min(1, dp * 2));

      U.drawGlow(ctx, 200, 320, 68, 'rgba(255, 90, 0, 0.78)', 'rgba(255, 0, 0, 0)');
      U.drawLightning(ctx, 200, 330, whipX, whipY, 8, 16, 4.5, '#ffee55', '#ff4400', Math.floor(t * 18) + 3);
    }

    // Right Breton Nightblade: Golden Solar Beam from Meridia's Dawnbreaker!
    if (phase >= 0.35 && phase < 0.84) {
      const bp = (phase - 0.35) / 0.49;
      U.drawVolumetricBeam(ctx, 346, 332, 4, W / 2 + 12, dolmenY - 42, 16, '#ffffff', 'rgba(255, 215, 60, 0.68)');
      U.drawLightning(ctx, 346, 332, W / 2 + 12, dolmenY - 42, 6, 10, 3.2, '#ffffff', '#ffcc22', Math.floor(t * 22) + 9);
      // Tri-Alliance Convergence Shockwave on the Daedric Titan!
      if (bp < 0.65) {
        const sp = bp / 0.65;
        U.drawShockwaveRing(ctx, W / 2, dolmenY - 42, 115, 75, sp, '255, 221, 85', 5);
        U.drawStarFlare(ctx, W / 2, dolmenY - 42, 42 * (1 - sp * 0.4), 8, 4, '#ffffff', t * 6);
      }
    }

    for (const s of soulSparks) {
      const sy = ((s.y - t * s.speed) % H + H) % H;
      const sx = s.x + Math.sin(t * 2.5 + s.y) * 12;
      ctx.fillStyle = s.isColdfire ? '#33eeff' : '#ff7722';
      ctx.beginPath();
      ctx.arc(sx, sy, s.size, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.restore();

    if (phase >= 0.35 && phase < 0.68) {
      const sp = (phase - 0.35) / 0.33;
      U.drawSpeedLines(ctx, W / 2, dolmenY - 42, 65, 245, 20, 'rgba(0, 238, 255, 0.32)', (1 - sp), 909);
    }
    U.drawCinematicVignette(ctx, W, H, 0.42);
  };
})();

</script>

  <script>
    (function() {
      const U = window.GameAnimUtils;
      const LOGICAL_W = 400;
      const LOGICAL_H = 500;
      const SCALE = 2; // 800x1000 high-DPI canvas buffer

      const plaqueRoot = document.getElementById('plaque-root');
      const cards = Array.from(document.querySelectorAll('.game-card'));
      const gameIds = ['game1','game2','game3','game4','game5','game6','game7','game8','game9'];
      const contexts = {};
      for (const id of gameIds) {
        const c = document.getElementById('canvas-' + id);
        if (c) contexts[id] = c.getContext('2d');
      }

      const fxCanvas = document.getElementById('flow-fx-canvas');
      const fxCtx = fxCanvas.getContext('2d');
      function resizeFxCanvas() {
        fxCanvas.width = window.innerWidth;
        fxCanvas.height = window.innerHeight;
      }
      window.addEventListener('resize', resizeFxCanvas);
      resizeFxCanvas();

      // URL parameters & Mode initialization
      const params = new URLSearchParams(window.location.search);
      const urlTime = params.has('t') ? parseFloat(params.get('t')) : null;
      const urlMode = params.get('mode');
      if (params.has('capture') || urlTime !== null) {
        document.body.classList.add('capture-clean');
      }

      // Default to Opus 5.5 Continuous Flow Mode unless ?mode=grid is passed
      window.__flowModeActive = (urlMode !== 'grid');

      const btnFlow = document.getElementById('btn-flow-mode');
      const btnGrid = document.getElementById('btn-grid-mode');

      function setFlowMode(enabled) {
        window.__flowModeActive = enabled;
        if (enabled) {
          document.body.classList.add('flow-mode-body');
          btnFlow.classList.add('active');
          btnGrid.classList.remove('active');
        } else {
          document.body.classList.remove('flow-mode-body');
          btnGrid.classList.add('active');
          btnFlow.classList.remove('active');
          plaqueRoot.style.transform = 'none';
          cards.forEach(c => c.classList.remove('flow-active'));
          fxCtx.clearRect(0, 0, fxCanvas.width, fxCanvas.height);
        }
      }

      setFlowMode(window.__flowModeActive);

      btnFlow.addEventListener('click', () => setFlowMode(true));
      btnGrid.addEventListener('click', () => setFlowMode(false));

      // Compute card centers relative to #plaque-root center (invariant to CSS transform!)
      function getCardMetrics() {
        const rootW = plaqueRoot.offsetWidth || 960;
        const rootH = plaqueRoot.offsetHeight || 1310;
        const rootCX = rootW * 0.5;
        const rootCY = rootH * 0.5;

        const cardCenters = cards.map(card => {
          let x = card.offsetWidth * 0.5;
          let y = card.offsetHeight * 0.5;
          let el = card;
          while (el && el !== plaqueRoot) {
            x += el.offsetLeft;
            y += el.offsetTop;
            el = el.offsetParent;
          }
          return {
            dx: x - rootCX,
            dy: y - rootCY,
            w: card.offsetWidth || 288,
            h: card.offsetHeight || 398,
            accent: card.dataset.accent || '#f5cc78'
          };
        });

        return { rootW, rootH, cardCenters };
      }

      // Compute Continuous Flow Camera state at time t (36.0s single-take cycle)
      function updateFlowCamera(t) {
        if (!window.__flowModeActive) return;

        const vw = window.innerWidth;
        const vh = window.innerHeight;
        if (fxCanvas.width !== vw || fxCanvas.height !== vh) {
          fxCanvas.width = vw;
          fxCanvas.height = vh;
        }
        fxCtx.clearRect(0, 0, vw, vh);

        const { rootW, rootH, cardCenters } = getCardMetrics();
        const overviewScale = Math.min((vw * 0.94) / rootW, (vh * 0.94) / rootH);
        const cardW = cardCenters[0].w;
        const cardH = cardCenters[0].h;
        const closeupScale = Math.min((vw * 0.84) / cardW, (vh * 0.84) / cardH);

        const T = ((t % 36.0) + 36.0) % 36.0;
        let camDX = 0;
        let camDY = 0;
        let camScale = overviewScale;
        let camRoll = 0;
        let activeIdx = -1;
        let transAlpha = 0;
        let transDirX = 0;
        let transDirY = 0;
        let transColor = '#f5cc78';

        if (T < 1.45) {
          // 1. Opening Monument Establishing Shot (0.0s -> 1.45s)
          const p = T / 1.45;
          camScale = overviewScale * (0.985 + 0.025 * U.smootherstep(p));
          camDX = 0;
          camDY = 0;
          camRoll = 0;
        } else if (T < 2.2) {
          // 2. Smooth Swooping Dive into Game 1: Commander Keen (1.45s -> 2.2s)
          const p = U.smootherstep((T - 1.45) / 0.75);
          const c0 = cardCenters[0];
          camDX = U.lerp(0, c0.dx - 7, p);
          camDY = U.lerp(0, c0.dy - 5, p) - Math.sin(p * Math.PI) * 28;
          camScale = U.lerp(overviewScale * 1.01, closeupScale * 0.98, p);
          camRoll = Math.sin(p * Math.PI) * -1.35;
          activeIdx = p > 0.5 ? 0 : -1;
          transAlpha = Math.sin(p * Math.PI);
          transDirX = c0.dx;
          transDirY = c0.dy;
          transColor = c0.accent;
        } else if (T < 33.05) {
          // 3. Single-Take Continuous Flow across Games 1 -> 9 (2.2s -> 33.05s)
          const flowElapsed = T - 2.2;
          const slotIdx = Math.min(8, Math.floor(flowElapsed / 3.5));
          const slotTime = flowElapsed - slotIdx * 3.5;
          const activeDur = 2.85;
          const transDur = 0.65;
          const cur = cardCenters[slotIdx];

          if (slotTime <= activeDur || slotIdx === 8) {
            // Dynamic Living Close-Up on Card `slotIdx`
            const lp = U.clamp(slotTime / activeDur, 0, 1);
            activeIdx = slotIdx;
            // Subtle breathing dolly & tracking drift synchronized with in-game action
            const dolly = 0.98 + 0.055 * Math.sin(lp * Math.PI);
            camScale = closeupScale * dolly;
            camDX = cur.dx + (lp - 0.5) * 14;
            camDY = cur.dy + Math.cos(lp * Math.PI) * -5;
            camRoll = Math.sin(lp * Math.PI * 2) * 0.35;
          } else {
            // Smooth Curved Glide Transition from Card `slotIdx` -> Card `slotIdx + 1`
            const next = cardCenters[slotIdx + 1];
            const rawP = (slotTime - activeDur) / transDur;
            const p = U.smootherstep(rawP);
            activeIdx = rawP < 0.5 ? slotIdx : slotIdx + 1;

            const startX = cur.dx + 7;
            const startY = cur.dy + 5;
            const endX = next.dx - 7;
            const endY = next.dy - 5;

            // Detect row-wrap crane sweep (Card 2 -> 3 or Card 5 -> 6)
            const isRowWrap = (slotIdx === 2 || slotIdx === 5);
            const arcLift = isRowWrap ? -55 : -18;
            const zoomDip = isRowWrap ? 0.22 : 0.09;

            camDX = U.lerp(startX, endX, p);
            camDY = U.lerp(startY, endY, p) + Math.sin(p * Math.PI) * arcLift;
            camScale = closeupScale * (0.98 - zoomDip * Math.sin(p * Math.PI));
            camRoll = Math.sin(p * Math.PI) * (isRowWrap ? -2.1 : 1.15);

            transAlpha = Math.sin(p * Math.PI);
            transDirX = endX - startX;
            transDirY = endY - startY;
            transColor = next.accent;
          }
        } else if (T < 34.0) {
          // 4. Grand Pull-Back from Game 9 (Elder Scrolls Online) to Full 3x3 Monument (33.05s -> 34.0s)
          const p = U.smootherstep((T - 33.05) / 0.95);
          const c8 = cardCenters[8];
          camDX = U.lerp(c8.dx + 7, 0, p);
          camDY = U.lerp(c8.dy + 5, 0, p) - Math.sin(p * Math.PI) * 32;
          camScale = U.lerp(closeupScale * 0.98, overviewScale * 1.01, p);
          camRoll = Math.sin(p * Math.PI) * 1.4;
          activeIdx = p < 0.35 ? 8 : -1;
          transAlpha = Math.sin(p * Math.PI);
          transDirX = -c8.dx;
          transDirY = -c8.dy;
          transColor = '#f5cc78';
        } else {
          // 5. Synchronized 9-Game Monument Finale (34.0s -> 36.0s)
          const p = (T - 34.0) / 2.0;
          camScale = overviewScale * (1.01 - 0.025 * U.smootherstep(p));
          camDX = 0;
          camDY = 0;
          camRoll = 0;
          activeIdx = -1;
        }

        // Apply hardware-accelerated camera transform to #plaque-root
        plaqueRoot.style.transform =
          `scale(${camScale.toFixed(4)}) rotate(${camRoll.toFixed(3)}deg) translate3d(${(-camDX).toFixed(2)}px, ${(-camDY).toFixed(2)}px, 0)`;

        // Highlight active close-up card
        for (let i = 0; i < cards.length; i++) {
          if (i === activeIdx) cards[i].classList.add('flow-active');
          else cards[i].classList.remove('flow-active');
        }

        // Draw Cross-Card Particle Bridge & Motion Streaks during Camera Glides
        if (transAlpha > 0.02) {
          const len = Math.hypot(transDirX, transDirY) || 1;
          const ux = -transDirX / len;
          const uy = -transDirY / len;

          fxCtx.save();
          fxCtx.globalAlpha = transAlpha * 0.75;
          for (let i = 0; i < 28; i++) {
            const seed = (i * 97 + Math.floor(t * 60)) % 1000;
            const rx = ((i * 137.5) % 1) * vw;
            const ry = ((i * 293.7) % 1) * vh;
            const streakLen = (45 + (i % 5) * 25) * transAlpha;

            const grad = fxCtx.createLinearGradient(rx, ry, rx + ux * streakLen, ry + uy * streakLen);
            grad.addColorStop(0, '#ffffff');
            grad.addColorStop(0.35, transColor);
            grad.addColorStop(1, 'rgba(0,0,0,0)');

            fxCtx.strokeStyle = grad;
            fxCtx.lineWidth = (i % 3 === 0) ? 3 : 1.8;
            fxCtx.beginPath();
            fxCtx.moveTo(rx, ry);
            fxCtx.lineTo(rx + ux * streakLen, ry + uy * streakLen);
            fxCtx.stroke();
          }
          fxCtx.restore();
        }

        // Subtle outer cinema lens vignette
        const vig = fxCtx.createRadialGradient(vw * 0.5, vh * 0.5, Math.min(vw, vh) * 0.36, vw * 0.5, vh * 0.5, Math.max(vw, vh) * 0.72);
        vig.addColorStop(0, 'rgba(0,0,0,0)');
        vig.addColorStop(1, 'rgba(0,0,0,0.48)');
        fxCtx.fillStyle = vig;
        fxCtx.fillRect(0, 0, vw, vh);
      }

      // Spotlight state (for Grid mode click)
      let activeSpotlight = null;
      const modal = document.getElementById('spotlight-modal');
      const spotCanvas = document.getElementById('spotlight-canvas');
      const spotCtx = spotCanvas.getContext('2d');
      const spotTitle = document.getElementById('spotlight-title');
      const spotYear = document.getElementById('spotlight-year');

      cards.forEach(card => {
        card.addEventListener('click', () => {
          activeSpotlight = card.dataset.game;
          spotTitle.textContent = card.dataset.title;
          spotYear.textContent = card.dataset.year;
          modal.classList.add('active');
        });
      });

      modal.addEventListener('click', (e) => {
        if (e.target === modal) {
          modal.classList.remove('active');
          activeSpotlight = null;
        }
      });

      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && activeSpotlight) {
          modal.classList.remove('active');
          activeSpotlight = null;
        }
      });

      const urlGame = params.get('spotlight');
      if (urlGame && window.GameAnimations[urlGame]) {
        const card = document.querySelector(`.game-card[data-game="${urlGame}"]`);
        if (card) {
          activeSpotlight = urlGame;
          spotTitle.textContent = card.dataset.title;
          spotYear.textContent = card.dataset.year;
          modal.classList.add('active');
        }
      }

      function renderAll(nowMs) {
        const t = (typeof window.__forcedTime === 'number')
          ? window.__forcedTime
          : (urlTime !== null ? urlTime : nowMs * 0.001);

        updateFlowCamera(t);

        for (const id of gameIds) {
          const ctx = contexts[id];
          const fn = window.GameAnimations[id];
          if (ctx && fn) {
            ctx.save();
            ctx.scale(SCALE, SCALE);
            ctx.beginPath();
            ctx.rect(0, 0, LOGICAL_W, LOGICAL_H);
            ctx.clip();
            fn(ctx, LOGICAL_W, LOGICAL_H, t);
            ctx.restore();
          }
        }

        if (activeSpotlight && window.GameAnimations[activeSpotlight]) {
          spotCtx.save();
          spotCtx.scale(SCALE, SCALE);
          spotCtx.beginPath();
          spotCtx.rect(0, 0, LOGICAL_W, LOGICAL_H);
          spotCtx.clip();
          window.GameAnimations[activeSpotlight](spotCtx, LOGICAL_W, LOGICAL_H, t);
          spotCtx.restore();
        }

        if (urlTime === null && typeof window.__forcedTime !== 'number') {
          requestAnimationFrame(renderAll);
        }
      }

      window.__renderAtTime = function(sec) {
        window.__forcedTime = sec;
        renderAll(sec * 1000);
      };

      requestAnimationFrame(renderAll);
    })();
  </script>
